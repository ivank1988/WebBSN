<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BSN Solution</title>
  <meta name="description" content="BSN Solution">
  <style>
    :root { --bg: #f6f7f9; --text: #1d2330; --muted: #5b6475; --accent: #1f6feb; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 12px; }
    p { color: var(--muted); font-size: 1.15rem; margin: 0 0 28px; }
    a.button { background: var(--accent); color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; }
    footer { position: fixed; bottom: 16px; width: 100%; text-align: center; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>BSN Solution</h1>
    <p>Our new website is coming soon.</p>
    <a class="button" href="mailto:info@bsnsolution.com">Contact us</a>
  </main>
  <footer>&copy; <span id="y"></span> BSN Solution</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
